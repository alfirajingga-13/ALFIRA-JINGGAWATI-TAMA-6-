<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kas Kelompok POKLAHSAR</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}
body{
background:#f4f7fc;
padding:30px;
}
.header{
background:#2952cc;
color:white;
padding:25px;
border-radius:15px;
margin-bottom:25px;
text-align:center;
position: relative;
}
.header h1{
margin-bottom:10px;
}
.header p{
opacity:.9;
}

/* Tombol Kembali di Header */
.btn-header {
position: absolute;
top: 20px;
left: 20px;
background: rgba(255,255,255,0.2);
color: white;
padding: 10px 15px;
border-radius: 8px;
text-decoration: none;
font-size: 14px;
transition: 0.3s;
}

.btn-header:hover {
background: rgba(255,255,255,0.3);
}

/* Tombol Floating Kembali */
.btn-floating {
position: fixed;
bottom: 30px;
right: 30px;
background: #2952cc;
color: white;
width: 55px;
height: 55px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 24px;
box-shadow: 0 4px 15px rgba(0,0,0,0.2);
text-decoration: none;
transition: 0.3s;
z-index: 1000;
}

.btn-floating:hover {
background: #1e3fa3;
transform: scale(1.1);
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}
.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
transition:0.3s;
text-align:center;
}
.card:hover{
transform:translateY(-5px);
}
.card i{
font-size:45px;
color:#2952cc;
margin-bottom:15px;
}
.card h3{
margin-bottom:10px;
color:#333;
}
.card p{
font-size:14px;
color:#666;
margin-bottom:20px;
line-height:1.6;
}
.btn{
display:inline-block;
padding:12px 20px;
background:#2952cc;
color:white;
text-decoration:none;
border-radius:10px;
transition:0.3s;
}
.btn:hover{
background:#1e3fa3;
}
.footer{
text-align:center;
margin-top:30px;
color:#666;
}
</style>
</head>
<body>

<div class="header">
    <!-- Tombol Kembali di Header -->
    <a href="index.html" class="btn-header">
        <i class="fas fa-home"></i> Beranda
    </a>
    
    <h1>Kas Kelompok dan Monitoring Evaluasi</h1>
    <p>Sistem Informasi POKLAHSAR</p>
</div>

<div class="cards">
    <!-- Isi card kamu tetap sama -->
    <div class="card">
        <i class="fas fa-file-circle-plus"></i>
        <h3>Google Form Formulir Pendaftaran</h3>
        <p>Form pengisian data formulir pendaftaran oleh pengurus dan anggota.</p>
        <a href="https://forms.gle/Ztuh7iKaYak5EJ1y5" target="_blank" class="btn">Buka Form</a>
    </div>

    <!-- ... Card lainnya tetap sama ... -->

</div>

<div class="footer">
    © 2026 Sistem Informasi POKLAHSAR | Fakultas Perikanan dan Ilmu Kelautan
</div>

<!-- Tombol Floating Kembali ke Index -->
<a href="index.html" class="btn-floating" title="Kembali ke Halaman Utama">
    <i class="fas fa-home"></i>
</a>

</body>
</html>
